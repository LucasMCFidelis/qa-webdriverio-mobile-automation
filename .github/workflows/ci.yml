name: Android E2E Tests (WebdriverIO + Cucumber)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "Tags do Cucumber para filtrar cenários (ex: @smoke)"
        required: false
        default: ""

env:
  API_LEVEL: 33
  TARGET: google_apis
  ARCH: x86_64
  AVD_NAME: test_emulator
  ANDROID_PLATFORM_VERSION: "13.0"

permissions:
  contents: write

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar driver UiAutomator2 do Appium
        run: |
          INSTALLED_DRIVERS=$(npx appium driver list --installed 2>&1 || true)
          if echo "$INSTALLED_DRIVERS" | grep -q uiautomator2; then
            echo "Driver uiautomator2 já instalado, pulando."
          else
            npx appium driver install uiautomator2
          fi

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Habilitar KVM para aceleração de hardware
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.TARGET }}-${{ env.ARCH }}

      - name: Criar AVD e gerar snapshot (cache miss)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "AVD criado e snapshot salvo."

      - name: Rodar testes WebdriverIO + Cucumber no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.TARGET }}
          arch: ${{ env.ARCH }}
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: chmod +x ./scripts/run-tests.sh && ./scripts/run-tests.sh "${{ github.event.inputs.tags }}"

      - name: Publicar allure-results (bruto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/**
          retention-days: 14

      - name: Publicar relatório Allure (HTML pronto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

  publish-report:
    needs: android-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Baixar allure-results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results
 
      - name: Gerar e publicar relatório com histórico
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
 
      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_DEPLOY_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history